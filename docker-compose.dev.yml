version: '3.8'
services:
  db:
    image: postgres:15
    container_name: codecircle_postgres_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-codecircle_db}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_codecircle:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_codecircle:
